<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Cascade Reserve Solutions</title>
    <meta name="description" content="Contact Cascade Reserve Solutions about reserve study consulting and property condition assessments.">
</head>

<body>

    <header>
        <nav>
            <div class="logo">
                <img src="logo-mark.png" alt="Cascade Reserve Solutions">
                <span>Cascade Reserve Solutions</span>
            </div>

            <div class="nav-links">
                <a href="index.html#services">Services</a>
                <a href="index.html#process">How It Works</a>
                <a href="index.html#about">About Us</a>
                <a href="index.html#contact">Contact</a>
            </div>
        </nav>
    </header>

    <main>

        <section class="contact-page">

            <div class="contact-page-content">

                <p class="eyebrow">GET STARTED</p>

                <h1>Let's talk about your community.</h1>

                <p class="contact-page-intro">
                    Have questions about a reserve study or want to get started?
                    Tell us a little about your community and we'll be in touch.
                </p>

                <form class="contact-form"
                    id="contact-form"
                      action="https://formspree.io/f/xyezdvgv"
                      method="POST">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="community">Community / HOA</label>
                        <input type="text" id="community" name="community">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="7" required></textarea>
                    </div>

                    <button type="submit" class="button primary">
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>

    <footer>

        <img src="logo-full.png"
             alt="Cascade Reserve Solutions"
             class="footer-logo">

        <p>&copy; 2026 Cascade Reserve Solutions, LLC. All rights reserved.</p>

    </footer>


    <script>
    const form = document.getElementById("contact-form");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const submitButton = form.querySelector("button[type='submit']");
        submitButton.disabled = true;
        submitButton.textContent = "Sending...";

        try {
            const response = await fetch(form.action, {
                method: "POST",
                body: new FormData(form),
                headers: {
                    "Accept": "application/json"
                }
            });

            if (response.ok) {
                window.location.href = "/";
            } else {
                submitButton.disabled = false;
                submitButton.textContent = "Send Message";
                alert("There was a problem sending your message. Please try again.");
            }
        } catch (error) {
            submitButton.disabled = false;
            submitButton.textContent = "Send Message";
            alert("There was a problem sending your message. Please try again.");
        }
    });
</script>


</body>



</html>
